<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#03050B">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Xenni: Study Smarter. Stay Organized. Level Up.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#03050B;--card:#080E19;--ink:#FFFFFF;--muted:#8495AA;--line:#123256;--soft:#0D1726;--purple:#087BFF;--mint:#00D9FF;--ice:#A8E8FF;--green:#35F59A;--gold:#FFC857;--amber:#FFAA33;--violet:#9B5CFF;--coral:#FF5A6E;--glowrgb:0,217,255}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Nunito',ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif;background-color:var(--bg);color:var(--ink);line-height:1.45;min-height:100vh;background-attachment:fixed;background-repeat:no-repeat}
body[data-pat=glow]{background-image:radial-gradient(120% 46% at 50% -8%,rgba(var(--glowrgb),.24),transparent 62%)}
body[data-pat=grid]{background-image:linear-gradient(rgba(var(--glowrgb),.07) 1px,transparent 1px),linear-gradient(90deg,rgba(var(--glowrgb),.07) 1px,transparent 1px);background-size:34px 34px;background-repeat:repeat}
body[data-pat=stars]{background-image:radial-gradient(circle at 12% 18%,rgba(var(--glowrgb),.9) 0 1.5px,transparent 2px),radial-gradient(circle at 78% 12%,#fff 0 1px,transparent 1.5px),radial-gradient(circle at 40% 52%,rgba(var(--glowrgb),.7) 0 1px,transparent 1.5px),radial-gradient(circle at 90% 70%,#fff 0 1.5px,transparent 2px),radial-gradient(circle at 20% 86%,#fff 0 1px,transparent 1.5px),radial-gradient(circle at 62% 92%,rgba(var(--glowrgb),.8) 0 1.5px,transparent 2px)}
h1,h2,h3,.disp{font-family:'Rajdhani','Nunito',ui-rounded,system-ui,sans-serif;line-height:1.1}
h1{font-size:2.1rem;font-weight:700;margin:8px 0 14px;text-shadow:0 0 18px rgba(var(--glowrgb),.55)}
h3{font-size:1.25rem;font-weight:700;margin:22px 0 10px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
.shell{max-width:520px;margin:0 auto;padding:18px 16px 160px}
.muted{color:var(--muted)}

/* loading screen */
.boot{position:fixed;inset:0;z-index:100;display:grid;place-items:center;text-align:center;padding:30px;color:#fff;background:radial-gradient(circle at 50% 30%,#0B3A78,#05070D 68%);transition:opacity .5s,visibility .5s}
.boot.out{opacity:0;visibility:hidden}
.boot-in{max-width:340px}
.boot svg{width:88px;height:88px;filter:drop-shadow(0 0 22px rgba(56,182,255,.7))}
.boot-name{font-size:2.6rem;font-weight:700;margin:14px 0 8px;text-shadow:0 0 20px rgba(56,182,255,.8)}
.boot p{font-weight:700;font-size:1.12rem;min-height:3.6em}
.boot .lbar{height:6px;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden;margin:18px auto 8px;width:180px}
.boot .lbar i{display:block;height:100%;width:40%;border-radius:99px;background:#38B6FF;box-shadow:0 0 12px #38B6FF;animation:load 1.2s ease-in-out infinite}
@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
.boot small{font-weight:700;opacity:.85}

/* home header */
.affhero{position:relative;overflow:hidden;border-radius:24px;padding:20px 20px 24px;color:#fff;background:linear-gradient(135deg,#06265A,#0B4DB5 60%,#1A6FEA);border:1px solid rgba(var(--glowrgb),.55);box-shadow:0 0 34px -10px rgba(var(--glowrgb),.75)}
.affhero .g{font-weight:800;font-size:1rem}
.affhero .aff{font-family:'Rajdhani',ui-rounded,sans-serif;font-size:1.75rem;font-weight:700;line-height:1.15;margin-top:8px;padding-right:20px}
.affhero .bar{width:54px;height:5px;border-radius:99px;background:#7FE3FF;box-shadow:0 0 12px #7FE3FF;margin-top:14px}
.affhero::after{content:"✦";position:absolute;right:18px;top:10px;font-size:1.9rem;color:var(--gold)}

/* profile card + xp */
.aura{width:92px;height:92px;border-radius:50%;padding:4px;margin-top:-46px;flex:none;animation:glow 3.2s ease-in-out infinite}
.avatar{width:100%;height:100%;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:46px;line-height:1}
@keyframes glow{0%,100%{box-shadow:0 0 12px 2px rgba(var(--glowrgb),.35)}50%{box-shadow:0 0 0 6px rgba(var(--glowrgb),.12),0 0 28px 6px rgba(var(--glowrgb),.6)}}
.top{display:flex;gap:14px;align-items:flex-end}
.who{padding-bottom:2px;min-width:0}
.who h2{font-size:1.6rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .sub{font-size:.85rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.titlechip{display:inline-flex;gap:8px;align-items:center;margin-top:14px;background:var(--purple);color:#fff;border-radius:999px;padding:5px 14px 5px 6px;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:1.1rem;box-shadow:0 0 16px -4px rgba(var(--glowrgb),.8)}
.titlechip b{background:var(--gold);color:#241F4A;border-radius:999px;padding:1px 10px;font-size:.9rem}
.xpbar{height:16px;border-radius:99px;background:var(--soft);margin-top:14px;overflow:hidden;border:1px solid var(--line)}
.xpbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--purple),var(--mint));box-shadow:0 0 14px rgba(var(--glowrgb),.9);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.xpmeta{display:flex;justify-content:space-between;font-size:.82rem;font-weight:700;color:var(--muted);margin-top:6px}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pill{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:800;font-size:.9rem}

/* cards and quests */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:inset 0 0 0 1px rgba(var(--glowrgb),.05),0 0 26px -16px rgba(var(--glowrgb),.7)}
.card+.card{margin-top:12px}
.empty{text-align:center;padding:26px 18px}
.empty p{margin:6px 0 14px;color:var(--muted)}
.quest{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.quest.is-done{opacity:.62}
.quest.is-done .q-title{text-decoration:line-through}
.check{width:46px;height:46px;border-radius:14px;border:2.5px solid var(--mint);display:grid;place-items:center;font-weight:800;font-size:1.2rem;color:#04121F;flex:none;transition:transform .15s,background .15s;box-shadow:0 0 12px -2px rgba(var(--glowrgb),.7)}
.check:not(:disabled):active{transform:scale(.88);background:var(--mint)}
.check:disabled{background:var(--green);border-color:var(--green);cursor:default}
.q-main{flex:1;min-width:0}
.q-title{font-weight:800;overflow-wrap:anywhere}
.q-meta{display:flex;gap:6px 10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:3px;align-items:center}
.late{color:var(--coral);font-weight:800}
.tag{border-radius:8px;padding:1px 8px;font-weight:700;color:var(--ink);background:rgba(var(--glowrgb),.16)}
.t-test,.t-exam{background:rgba(255,90,110,.2)}
.t-study,.t-reading{background:rgba(53,224,192,.2)}
.t-goal,.t-personal{background:rgba(255,201,60,.22)}
.q-side{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.q-act{display:flex;gap:2px}
.xpchip{background:var(--gold);color:#241F4A;font-weight:800;font-size:.78rem;border-radius:999px;padding:2px 9px;white-space:nowrap}
.x{width:34px;height:34px;border-radius:10px;color:var(--muted);font-size:.95rem}
.x:hover{background:var(--soft)}
.prog{display:flex;justify-content:space-between;align-items:baseline;margin:22px 4px 10px}
.prog h3{margin:0}
.prog span{font-size:.85rem;font-weight:700;color:var(--muted)}
.rem{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);font-weight:600}
.rem:first-of-type{border-top:0;padding-top:0}
.rem:last-child{padding-bottom:0}
.rem .dot{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--soft)}
.rem.coral .dot{background:rgba(255,90,110,.25)}
.rem.gold .dot{background:rgba(255,201,60,.28)}
.lec{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.lec:first-of-type{border-top:0}
.lec small{color:var(--muted);display:block}
.now{background:var(--mint);color:#04121F;border-radius:8px;font-size:.72rem;font-weight:800;padding:1px 7px;margin-left:6px}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;background:var(--purple);background-image:linear-gradient(rgba(0,0,0,.14),rgba(0,0,0,.14));color:#fff;font-weight:800;box-shadow:0 0 20px -4px rgba(var(--glowrgb),.75)}
.btn.mint{background:var(--mint);color:#04121F}
.btn.ghost{background:var(--soft);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.btn.danger{background:var(--coral);color:#1A0509;box-shadow:none}
.btn.block{display:flex;width:100%;margin-top:18px}
.btn:disabled{opacity:.45;box-shadow:none}
.btn:active:not(:disabled){transform:scale(.98)}
.seg{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{flex:1;min-height:42px;border-radius:10px;font-weight:800;color:var(--muted)}
.seg button.on{background:var(--purple);color:#fff;box-shadow:0 0 14px -4px rgba(var(--glowrgb),.8)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.ch{flex:none;min-height:38px;padding:0 14px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-weight:700;font-size:.9rem}
.ch.on{background:var(--purple);color:#fff;border-color:var(--mint)}
label{display:block;font-weight:800;font-size:.9rem;margin:14px 0 6px}
input,select,textarea{width:100%;min-height:48px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
input[type=range]{padding:0;min-height:40px;accent-color:var(--mint);border:0;background:none}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:3px solid rgba(var(--glowrgb),.35);border-color:var(--mint)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--coral);font-weight:700;margin-top:8px;min-height:1.2em}
.hint{font-size:.8rem;color:var(--muted);margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.av{aspect-ratio:1;border-radius:16px;background:var(--soft);font-size:1.9rem;border:2.5px solid transparent}
.av.sel,.bn.sel,.typ.sel,.bgsw.sel{border-color:var(--mint);background:rgba(var(--glowrgb),.14)}
.banners{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bn{border-radius:12px;border:2.5px solid transparent;padding:4px;background:var(--soft);text-align:center}
.bn span{display:block;height:46px;border-radius:9px;background-size:cover;background-position:center}
.bn em{display:block;font-style:normal;font-size:.72rem;font-weight:700;margin-top:4px}
.bn:disabled{opacity:.5}
.types{display:flex;flex-wrap:wrap;gap:8px}
.typ{border-radius:12px;padding:8px 12px;background:var(--soft);font-weight:700;font-size:.9rem;border:2.5px solid transparent}
.back{display:inline-flex;align-items:center;gap:4px;min-height:40px;font-weight:800;color:var(--muted);margin:-6px 0 0 -6px;padding:0 10px 0 4px}
.back svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

/* nav + fab */
.dock{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none;z-index:20}
.dock>div{position:relative;width:100%;max-width:520px;pointer-events:auto}
.nav{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px -18px rgba(var(--glowrgb),.7)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;font-size:.72rem;font-weight:800;color:var(--muted)}
.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--mint);background:var(--soft);text-shadow:0 0 12px rgba(var(--glowrgb),.9)}
.fab{position:absolute;right:18px;top:-74px;width:60px;height:60px;border-radius:18px;background:var(--mint);color:#04121F;font-size:2rem;font-weight:700;box-shadow:0 0 26px -2px rgba(var(--glowrgb),.9);display:grid;place-items:center}
.fab:active{transform:scale(.92)}
body[data-fab="0"] .fab{display:none}
body.no-nav .dock{display:none}

/* tools hub */
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;fill:none;stroke:var(--muted);stroke-width:2.2;stroke-linecap:round}
.search input{padding-left:44px;border-radius:999px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tcard{position:relative;aspect-ratio:9/13;border-radius:20px;overflow:hidden;color:#fff;text-align:left;padding:14px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid rgba(var(--glowrgb),.45);box-shadow:0 0 26px -12px rgba(var(--glowrgb),.85);transition:transform .15s}
.tcard:active{transform:scale(.97)}
.tcard::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 38%,rgba(2,6,16,.7));pointer-events:none}
.tcard>*{position:relative;z-index:1}
.tcard .ring{width:48px;height:48px;border-radius:50%;padding:3px;background:linear-gradient(135deg,#7FE3FF,#1A6FEA,#7B4DFF)}
.tcard .ring span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:rgba(2,6,16,.65);font-size:1.4rem}
.tcard .tart{position:absolute;z-index:0;right:-10px;top:30%;font-size:5.6rem;transform:rotate(-14deg);opacity:.28}
.tcard h3{margin:0;font-size:1.5rem;color:#fff}
.tcard small{display:block;font-weight:700;font-size:.8rem;opacity:.95;margin-top:2px}
.tcard .soon{position:absolute;top:14px;right:14px;background:var(--gold);color:#241F4A;border-radius:999px;font-size:.72rem;font-weight:800;padding:2px 10px}
.tcard.more{background:var(--soft);border:2px dashed var(--line);color:var(--ink);box-shadow:none}
.tcard.more::after{display:none}
.tcard.more h3{color:var(--ink)}
.tcard.more .ring span{background:var(--card)}

/* sheet, overlay, popup, toast */
.sheet-wrap{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet-wrap.hidden{display:none}
.scrim{position:absolute;inset:0;background:rgba(0,2,8,.72)}
.sheet{position:relative;width:100%;max-width:520px;max-height:90vh;overflow:auto;background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px -14px rgba(var(--glowrgb),.6)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h2{font-size:1.7rem;font-weight:700;margin-bottom:4px}
.overlay{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;color:#fff;background:radial-gradient(circle at 50% 28%,#0B3A78,#05070D 75%);overflow:hidden}
.overlay .aura{width:150px;height:150px;padding:6px;margin:0 0 18px}
.overlay .avatar{background:#05070D;font-size:78px}
.overlay .avatar.num{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:4rem;color:var(--gold)}
.overlay h2{font-size:2.5rem;font-weight:700;text-shadow:0 0 20px rgba(56,182,255,.8)}
.overlay p{max-width:30ch;margin:8px 0 22px;font-weight:700;font-size:1.1rem;opacity:.95}
.overlay .btn{min-width:200px}
.cf{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(540deg)}}
.pop{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:24px;background:rgba(0,2,8,.75)}
.pop-card{width:100%;max-width:360px;background:var(--card);border:1px solid var(--mint);border-radius:22px;padding:22px;box-shadow:0 0 40px -8px rgba(var(--glowrgb),.7);animation:up .28s cubic-bezier(.2,.8,.2,1)}
.pop-card h2{font-size:1.7rem;font-weight:700}
.pop-card ul{margin:10px 0 0 18px;font-weight:600}
.pop-card .row2{margin-top:18px}
.toast{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,220%);background:#07101D;border:1px solid var(--mint);color:var(--gold);padding:10px 18px;border-radius:14px;font-weight:800;z-index:120;white-space:pre-line;text-align:center;transition:transform .3s cubic-bezier(.2,.8,.2,1);max-width:90vw;box-shadow:0 0 30px -6px rgba(var(--glowrgb),.8)}
.toast.show{transform:translate(-50%,0)}

/* banner editor */
.crop{position:relative;width:100%;aspect-ratio:3/1;border-radius:14px;overflow:hidden;background:#05070D;touch-action:none;cursor:grab;border:2px solid var(--mint);margin-top:12px}
.crop:active{cursor:grabbing}
.crop img{position:absolute;max-width:none;pointer-events:none;user-select:none;-webkit-user-drag:none}

/* ranks, profile */
.rank{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);margin-bottom:8px}
.rank.cur{border:2px solid var(--mint);background:rgba(var(--glowrgb),.12);box-shadow:0 0 22px -8px rgba(var(--glowrgb),.9)}
.rank.lock{opacity:.55}
.rk-n{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:1.5rem;min-width:36px;text-align:center;color:var(--mint)}
.rk-main{flex:1}
.rk-main b{display:block;font-family:'Rajdhani',sans-serif;font-size:1.25rem}
.rk-main span{font-size:.82rem;color:var(--muted)}
.rk-state{font-weight:800}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bd{text-align:center;padding:12px 6px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.bd .ic{font-size:2rem}
.bd b{display:block;font-size:.82rem;margin-top:2px}
.bd small{display:block;font-size:.7rem;color:var(--muted);margin-top:2px}
.bd.lock{opacity:.5}
.bd.lock .ic{filter:grayscale(1)}
.bd.pick{border:2px solid transparent;width:100%}
.bd.pick.sel{border-color:var(--mint);background:rgba(var(--glowrgb),.14)}
.pbanner{height:132px;border-radius:20px 20px 0 0;background-size:cover}
.pcard{border-radius:20px;overflow:hidden;background:var(--card);border:1px solid rgba(var(--glowrgb),.5);box-shadow:0 0 34px -12px rgba(var(--glowrgb),.8)}
.pbody{padding:0 18px 18px}
.bio{margin-top:12px;font-weight:600;overflow-wrap:anywhere}
.quote{margin-top:10px;font-style:italic;color:var(--muted)}
.goal{margin-top:10px;background:var(--soft);border-radius:12px;padding:10px 12px;font-weight:700;font-size:.92rem}
.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.slot{aspect-ratio:1;border-radius:16px;background:var(--soft);display:grid;place-items:center;text-align:center;padding:6px;font-size:.72rem;font-weight:700;color:var(--muted);border:2px dashed var(--line)}
.slot.f{border:2px solid var(--gold);color:var(--ink);background:rgba(255,201,60,.14)}
.slot .ic{font-size:1.9rem;display:block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{text-align:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 6px}
.stat b{display:block;font-family:'Rajdhani',sans-serif;font-size:1.9rem;font-weight:700}
.stat span{font-size:.72rem;color:var(--muted);font-weight:700}
.stat em{display:block;font-style:normal;font-weight:800;font-size:.9rem}
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0}
.sw{width:54px;height:32px;border-radius:99px;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}

.notice{background:rgba(255,201,60,.16);border:1px solid rgba(255,201,60,.4);border-radius:12px;padding:10px 12px;font-size:.85rem;font-weight:700;margin-top:12px}
.day h3{margin:16px 0 6px}
.day.today h3{color:var(--mint)}
.welcome{padding-top:28px}
.welcome h1{font-size:2.8rem}
.welcome .tag-line{font-weight:700;color:var(--muted);margin-bottom:8px}
.bgs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.bgsw{border-radius:12px;border:2.5px solid transparent;padding:4px;background:var(--soft);text-align:center;font-size:.72rem;font-weight:700}
.bgsw span{display:block;height:40px;border-radius:8px;margin-bottom:4px}

/* timer */
.tclock{font-family:'Rajdhani',sans-serif;font-size:3.8rem;font-weight:700;text-align:center;letter-spacing:.04em;text-shadow:0 0 24px rgba(var(--glowrgb),.85);margin:8px 0}
.tcenter{text-align:center}
.rules{margin:8px 0 0 18px;font-weight:600;font-size:.9rem;color:var(--muted)}
.rules li{margin-top:4px}

/* stats */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:700 10px 'Nunito',sans-serif}

.glowline{filter:drop-shadow(0 0 5px rgba(var(--glowrgb),.9))}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi small{display:block;color:var(--muted);font-weight:700;font-size:.78rem}
.kpi b{display:block;font-family:'Rajdhani',sans-serif;font-size:1.9rem;font-weight:700;line-height:1.1}
.dl{font-size:.78rem;font-weight:800}
.dl.up{color:#35E0A6}
.dl.dn{color:var(--coral)}
.dl.eq{color:var(--muted)}
.ringbox{display:flex;gap:16px;align-items:center}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:10px;font-size:.82rem;font-weight:700}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.hrow{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.hrow:first-of-type{border-top:0}
.hrow .hi{font-size:1.4rem;flex:none;width:34px;text-align:center}
.hrow .hm{flex:1;min-width:0}
.hrow .hm b{display:block;overflow-wrap:anywhere}
.hrow .hm small{color:var(--muted);font-weight:700}
.hrow .hx{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:1.2rem;color:var(--gold);white-space:nowrap}
.vb{display:inline-block;border-radius:6px;padding:0 6px;font-size:.68rem;font-weight:800;margin-left:6px;vertical-align:middle}
.v-low{background:rgba(143,163,199,.25);color:var(--muted)}
.v-moderate{background:rgba(var(--glowrgb),.22);color:var(--mint)}
.v-high{background:rgba(53,224,166,.22);color:#35E0A6}

.srcbar{display:flex;height:14px;border-radius:99px;overflow:hidden;margin-top:10px;background:var(--soft)}
/* home redesign */
.wel{position:relative;border-radius:20px;padding:14px 16px;color:#fff;background:linear-gradient(135deg,#031A40,#05388C 55%,#087BFF);border:1px solid rgba(0,217,255,.5);box-shadow:0 0 30px -10px rgba(0,217,255,.7)}

.lv{display:flex;align-items:center;gap:10px;margin-top:12px}
.lv .rk{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:1rem;white-space:nowrap}
.lvbar{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
.lvbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--ice),var(--violet));box-shadow:0 0 10px rgba(168,232,255,.8)}
.lv .lvx{font-size:.74rem;font-weight:800;color:var(--ice);white-space:nowrap}
.sec{margin-top:24px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.sec-h h3{margin:0}
.link{color:var(--mint);font-weight:800;font-size:.85rem;padding:6px 0 6px 10px}
.sec.prime>.card{border-color:rgba(0,217,255,.35);box-shadow:inset 0 0 0 1px rgba(0,217,255,.07),0 0 28px -14px rgba(0,217,255,.8)}

.pg-top{display:flex;gap:14px;align-items:center;cursor:pointer}
.pg-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.mini{text-align:left;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0;cursor:pointer}
.mini small{display:block;color:var(--muted);font-size:.74rem;font-weight:700}
.mini b{display:block;font-family:'Rajdhani',sans-serif;font-size:1.55rem;line-height:1.1}
.mini .sub{display:block;color:var(--muted);font-size:.74rem;font-weight:700}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px 4px;margin-top:6px;text-align:center}

.crow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;padding:10px 12px;border-radius:12px;border:1px dashed var(--line);font-size:.82rem;font-weight:700;color:var(--muted)}
.acad{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{text-align:left;background:var(--card);border:1px solid var(--line);border-top:3px solid var(--c,var(--mint));border-radius:16px;padding:11px 12px;min-height:104px;display:flex;flex-direction:column;gap:2px;min-width:0;overflow:hidden;box-shadow:0 0 22px -16px var(--c,var(--mint))}
.cat .ch1{display:flex;align-items:center;gap:6px;font-weight:800;font-size:.85rem;color:var(--ice);margin-bottom:2px}
.cat .big{font-family:'Rajdhani',sans-serif;font-size:1.9rem;font-weight:700;line-height:1}
.cat small{color:var(--muted);font-size:.76rem;font-weight:700}
.cat .cl{font-weight:800;font-size:.95rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;line-height:1.2}

.pr{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:.82rem;font-weight:800;color:var(--muted)}
.prbar{flex:1;height:8px;border-radius:99px;background:var(--soft);overflow:hidden}

.srow:first-of-type{border-top:0}

.srow.dim{opacity:.6}
.stm{width:62px;flex:none;font-weight:800;font-size:.78rem;color:var(--ice)}
.sbody{flex:1;min-width:0;text-align:left}
.sbody b{display:block;overflow-wrap:anywhere}
.sbody small{color:var(--muted);font-weight:700;font-size:.76rem}
.sst{flex:none;display:flex;align-items:center}
.check.sm{width:38px;height:38px;border-radius:12px;font-size:1rem}
.sdone{color:var(--green);font-weight:800;font-size:.78rem}
.snow{background:var(--mint);color:#04121F;border-radius:8px;font-size:.72rem;font-weight:800;padding:2px 8px}
.cempty{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700}
.rm{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c,var(--mint));margin-bottom:8px}
.rm.u1{--c:var(--mint)}
.rm.u2{--c:var(--amber)}
.rm.u3{--c:var(--coral)}
.rm .ri{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--soft)}
.rm .rt{flex:1;font-weight:700;overflow-wrap:anywhere}
.rm .rc{color:var(--muted);font-size:1.2rem}
.mot .q{font-family:'Rajdhani',sans-serif;font-size:1.25rem;font-weight:700;line-height:1.2}
.mot .rec{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-weight:600}
.mot .enc{margin-top:10px;font-weight:700;font-size:.88rem;color:var(--ice)}
.t-meeting,.t-seminar{background:rgba(94,168,255,.2)}
.t-skill{background:rgba(155,92,255,.24)}
.t-other{background:rgba(132,149,170,.22)}
/* notification popups */
.ntf-host{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top));z-index:110;display:flex;justify-content:center;padding:0 12px;pointer-events:none}
.ntf{--ac:#00D9FF;position:relative;display:flex;align-items:center;width:100%;max-width:480px;pointer-events:auto;animation:ntfin .45s cubic-bezier(.2,.9,.25,1) both}
.ntf-host.out .ntf{animation:ntfout .25s ease-in both}
.nav-av{position:relative;z-index:2;flex:none;width:58px;height:58px;margin-right:-16px;border-radius:50%;padding:3px;background:linear-gradient(135deg,var(--ac),#087BFF);box-shadow:0 0 18px var(--ac);animation:avin .5s .08s cubic-bezier(.2,.9,.25,1) both}
.nav-av .nm{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:#03050B;font-size:30px;line-height:1}
.ntf.major .nav-av::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--ac);animation:ring 1.4s .2s ease-out 2 both}
@keyframes ring{from{opacity:.9;transform:scale(.8)}to{opacity:0;transform:scale(2)}}
.sp{position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50%;background:var(--ac);box-shadow:0 0 8px var(--ac);opacity:0;animation:spark .95s ease-out forwards}
@keyframes spark{0%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.4)}}
.npanel{position:relative;flex:1;min-width:0;padding:11px 12px 11px 26px;border-radius:16px;background:linear-gradient(135deg,rgba(8,14,25,.97),rgba(3,10,26,.97));border:1px solid var(--ac);box-shadow:inset 0 0 0 1px rgba(255,255,255,.04),0 0 26px -6px var(--ac);overflow:hidden}
.ntf.major .npanel{box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),0 0 40px -2px var(--ac)}
.npanel::before{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.16) 50%,transparent 65%);transform:translateX(-120%);animation:scan 1.1s .25s ease-out 1 both;pointer-events:none}
@keyframes scan{to{transform:translateX(120%)}}
@keyframes ntfin{from{opacity:0;transform:translateY(-14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes ntfout{to{opacity:0;transform:translateY(-10px) scale(.97)}}
@keyframes avin{from{opacity:0;transform:translateX(-22px) scale(.7)}to{opacity:1;transform:none}}
.nhead{display:flex;align-items:center;gap:8px}
.nic{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:rgba(255,255,255,.1);font-size:.95rem}
.nt{flex:1;min-width:0;font-family:'Rajdhani',sans-serif;font-size:1.12rem;font-weight:700;letter-spacing:.03em;color:#fff;overflow-wrap:anywhere}
.nx{flex:none;width:30px;height:30px;border-radius:9px;color:var(--muted);font-size:.85rem}
.nx:hover{background:rgba(255,255,255,.08)}
.nmsg{margin-top:3px;color:var(--ice);font-weight:700;font-size:.9rem;overflow-wrap:anywhere}
.nchip{display:inline-block;margin-top:6px;padding:1px 10px;border-radius:999px;background:var(--ac);color:#03050B;font-weight:800;font-size:.78rem}
.nprog{height:7px;margin-top:8px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.nprog i{display:block;height:100%;border-radius:99px;background:var(--ac);box-shadow:0 0 10px var(--ac)}
.nl{margin:6px 0 0 16px;color:var(--muted);font-size:.78rem;font-weight:600}
.nbtn{margin-top:8px;min-height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--ac);color:var(--ac);background:rgba(0,0,0,.25);font-weight:800;font-size:.76rem;letter-spacing:.09em}
.nbtn:active{transform:scale(.97)}
@media (max-width:359px){
 .ntf{align-items:flex-start;margin-top:18px}
 .nav-av{position:absolute;top:-18px;left:10px;width:46px;height:46px;margin:0}

 .npanel{padding:20px 10px 10px 12px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.cf{display:none}}

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

function dkey(d){d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function pd(k){var a=k.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])}
function diffDays(a,b){return Math.round((pd(a)-pd(b))/86400000)}
function addDays(k,n){var d=pd(k);d.setDate(d.getDate()+n);return dkey(d)}
function lastDays(n,end){end=end||dkey();var a=[];for(var i=n-1;i>=0;i--)a.push(addDays(end,-i));return a}
function weekStart(k){var d=pd(k);d.setDate(d.getDate()-((d.getDay()+6)%7));return dkey(d)}
function fmtTime(t){if(!t)return '';var a=t.split(':').map(Number),h=a[0],ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+pad(a[1])+' '+ap}
function fmtDate(k){return pd(k).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})}
function fmtClock(ms){var s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return (h?h+':':'')+pad(m)+':'+pad(s%60)}

// Only one sound plays at a time: a new sound is scheduled after the previous one finishes.
function playSnd(name,big){
  if(!S.settings.sound||document.hidden)return;
  var notes=SOUNDS[(name==='xp'&&big)?'xpbig':name];if(!notes)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
    var vol=Math.max(0,Math.min(100,S.settings.volume==null?60:S.settings.volume))/100,now=ac.currentTime;
    if(sndUntil-now>2.5)return;                       // do not let sounds pile up
    var start=Math.max(now+.02,sndUntil),end=start;
    notes.forEach(function(n){
      var o=ac.createOscillator(),g=ac.createGain(),t0=start+n.t,t1=t0+n.d;o.type=n.w;
      if(Array.isArray(n.f)){o.frequency.setValueAtTime(n.f[0],t0);o.frequency.exponentialRampToValueAtTime(n.f[1],t1)}else o.frequency.setValueAtTime(n.f,t0);
      g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(Math.max(.0002,VOL_BASE*vol*n.g),t0+Math.min(.02,n.d/3));g.gain.exponentialRampToValueAtTime(.0001,t1);
      o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t1+.03);end=Math.max(end,t1)});
    sndUntil=end+.08
  }catch(e){}}

function checkReminders(){
  if(!S.profile)return;
  var today=dkey(),shown=0;S.popped=S.popped||{};
  Object.keys(S.popped).forEach(function(k){if(S.popped[k]!==today)delete S.popped[k]});
  remindersList().filter(function(r){return r.u>=2}).forEach(function(r){
    var key=r.k+r.id+':'+r.u;if(S.popped[key]||shown>=2)return;

// One reminder per activity, graded by urgency: 3 urgent (red), 2 approaching (amber), 1 normal (cyan).
function remindersList(){
  var today=dkey(),now=new Date(),mins=now.getHours()*60+now.getMinutes(),out=[];
  S.tasks.filter(function(t){return !t.done}).forEach(function(t){
    var d=diffDays(t.date,today),T=TYPES[t.type],ty=t.type,m=t.time?mm(t.time):null,u=0,text='';
    var work=(ty==='assignment'||ty==='project'),exam=(ty==='test'||ty==='exam'),ev=(ty==='meeting'||ty==='seminar'),learn=(ty==='study'||ty==='reading');
    if(d<0){u=3;text=t.title+' is overdue by '+(-d)+' day'+(-d>1?'s':'')}
    else if(d===0){
      if(work||exam){var soon=m!=null&&m-mins<=180&&m-mins>=-60;u=soon?3:2;text=T.label+': '+t.title+' is due '+(m!=null?'at '+fmtTime(t.time):'today')}
      else if(ev){u=(m!=null&&m-mins<=120)?2:1;text=T.label+': '+t.title+(m!=null?' at '+fmtTime(t.time):' today')}
      else if(learn){if(m!=null&&m-mins>=0&&m-mins<=15){u=2;text=t.title+' starts in '+(m-mins)+' minute'+((m-mins)===1?'':'s')}else{u=1;text=(ty==='reading'?'Read: ':'Revise: ')+t.title+' today'}}
      else{u=1;text=t.title+' is planned for today'}}
    else if(d===1){
      if(work){u=2;text=t.title+' is due tomorrow'}
      else if(exam||ev){u=2;text=T.label+' tomorrow: '+t.title}}
    else if(exam&&d<=(ty==='exam'?7:3)){u=d<=(ty==='exam'?3:2)?2:1;text=T.label+' in '+d+' days: '+t.title+'. Time to revise.'}
    else if(work&&d<=3){u=1;text=t.title+' is due in '+d+' days'}
    else if(ev&&d<=7){u=1;text=T.label+': '+t.title+' on '+pd(t.date).toLocaleDateString(undefined,{weekday:'long'})}
    if(u)out.push({k:'task',id:t.id,u:u,icon:T.icon,text:text,key:t.date+(t.time||'99:99'),ov:d<0})});
  var shown=false;
  S.lectures.filter(function(l){return l.day===now.getDay()}).sort(function(a,b){return a.start.localeCompare(b.start)}).forEach(function(l){
    var s=mm(l.start),e=mm(l.end);if(e<=mins||s<=mins)return;

  return out.sort(function(a,b){return (b.u-a.u)||a.key.localeCompare(b.key)})}

  var strong=Object.keys(wk).filter(function(w){return wk[w]>=5}).length,fp=days*10+strong*30,L=0;

/* ---------- XP engine: verification, limits and anti-cheat ---------- */
// Every XP gain goes through award(): once-only rules, daily and weekly limits, rate limit, logging and streaks.
function award(o){
  var day=dkey(),now=Date.now(),xp=Math.max(0,Math.round(o.xp)),lines=o.lines||[],type=o.type,note='',left;
  if(o.key&&S.awarded[o.key]){xp=0;note='XP already awarded';lines.push('XP for this was already awarded once.')}
  if(xp>0&&o.kind==='mission'&&CAPS[type]&&S.tasks.filter(function(x){return x.done&&x.type===type&&x.doneDay===day&&x.id!==o.taskId}).length>=CAPS[type]){xp=0;note='Daily limit';lines.push('Daily limit reached for '+TYPES[type].label.toLowerCase()+'s: no XP.')}
  if(xp>0&&WEEKLY[type]){left=WEEKLY[type]-sumXP(function(e){return e.type===type&&e.day>=addDays(day,-6)});
    if(left<=0){xp=0;note='Weekly limit';lines.push('Weekly limit reached for this activity.')}else if(xp>left){xp=left;lines.push('Weekly limit reached: XP trimmed.')}}
  if(xp>0&&o.kind==='timer'){left=TIMERMAX-sumXP(function(e){return e.kind==='timer'&&e.day===day});
    if(left<=0){xp=0;note='Timer limit';lines.push('Daily timer XP limit reached.')}else if(xp>left){xp=left;lines.push('Daily timer XP limit reached: XP trimmed.')}}
  if(xp>0){left=DAYMAX-sumXP(function(e){return e.day===day});
    if(left<=0){xp=0;note='Daily XP limit';lines.push('Daily XP limit reached. Come back tomorrow.')}else if(xp>left)xp=left}
  if(xp>0&&sumXP(function(e){return now-e.ts<600000})>=RATE){xp=0;note='Paused';lines.push('XP is paused for a few minutes. Slow down and take a break.')}
  if(o.key&&xp>0)S.awarded[o.key]=now;
  S.xp+=xp;S.coins+=Math.round(xp/10);
  S.log.push({id:uid(),ts:now,day:day,kind:o.kind,type:type,title:o.title,xp:xp,v:o.v,min:o.min||0,sum:o.sum||'',note:note});
  if(S.log.length>2000)S.log=S.log.slice(-2000);
  var s=S.stats;
  if(sumXP(function(e){return e.day===day})>=STREAKXP&&s.last!==day){s.streak=(s.last&&diffDays(day,s.last)===1)?s.streak+1:1;s.last=day;s.best=Math.max(s.best,s.streak)}
  return {xp:xp}}
function commit(beforeL){
  var nb=[];BADGES.forEach(function(b){if(S.badges.indexOf(b.id)<0&&b.test(S)){S.badges.push(b.id);nb.push(b)}});
  nb.forEach(function(b){notify({type:'achieve',title:'Achievement unlocked',msg:b.name+': '+b.desc,icon:b.icon,action:{kind:'tab',v:'ranks'}})});
  save();render();buzz(30);
  var a=levelFor(S.xp);
  if(a>beforeL){var t=titleFor(a);notify({type:'level',title:'Rank '+a+' unlocked',msg:'You are now '+t.name+(t.lang?' ('+t.lang+' for '+t.mean+')':', '+t.mean)+'.'+(a===20?' App backgrounds are now unlocked.':''),chip:'RANK '+a,action:{kind:'tab',v:'ranks'}})}}
function completeTask(t,o){
  var today=dkey(),T=TYPES[t.type],lines=[],beforeL=levelFor(S.xp),v=o.v;
  var raw=T.xp*VM[v]*(o.perf||1),scored=(t.type==='assignment'||t.type==='project'),late=scored&&today>t.date;
  if(late){raw*=.4;lines.push('Late finish: reduced XP')}
  if(t.created&&Date.now()-t.created<60000&&t.type!=='personal'&&t.type!=='goal'){raw*=.5;lines.push('Finished very quickly: reduced XP')}
  var key=ONCE[t.type]?[t.type,norm(t.title),norm(t.course),t.date].join('|'):null;
  t.done=true;t.doneAt=Date.now();t.doneDay=today;t.v=v;if(o.evidence)t.evidence=o.evidence;
  var r=award({kind:'mission',type:t.type,title:t.title,v:v,xp:raw,key:key,taskId:t.id,lines:lines});
  t.xp=r.xp;
  var s=S.stats;s.done++;if(t.type==='study'||t.type==='reading')s.study++;if(t.type==='exam')s.exams++;if(scored&&!late)s.onTime++;if(v==='high')s.high++;
  var act={kind:'detail',k:'task',id:t.id};
  if(r.xp>0)notify({type:'task',title:'Mission complete',msg:t.title,xp:r.xp,v:v,lines:lines,action:act});
  else notify({type:'warn',title:'Mission complete, no XP',msg:t.title,lines:lines,action:act});
  var td=S.tasks.filter(function(x){return x.date===today});
  if(td.length>=3&&td.every(function(x){return x.done})&&s.bonusDay!==today){s.bonusDay=today;var b=award({kind:'bonus',type:'bonus',title:"Today's plan complete",v:'moderate',xp:50,lines:[]});
    if(b.xp>0)notify({type:'xp',title:"Today's plan complete",msg:'You finished every mission due today.',xp:b.xp,v:'moderate',action:{kind:'stats',sub:'hist'}})}
  commit(beforeL)}

/* banner editor: drag to move, pinch or slider to zoom, fill or fit */
function openBannerEditor(raw){
  captureFields();
  var im=new Image();
  im.onload=function(){
    ed={raw:raw,img:im,iw:im.naturalWidth,ih:im.naturalHeight,cx:0,cy:0,s:1,sc:1,sf:1,smax:4,fw:1,fh:1};
    openSheet('<h2>Adjust banner</h2><p class="muted">Drag to move the photo. Pinch or use the slider to zoom.</p><div class="crop" id="crop"><img id="cimg" alt="Banner preview" draggable="false"></div>'+
      '<label for="zoom">Zoom</label><input id="zoom" type="range" min="0" max="100" value="0" aria-label="Zoom">'+
      '<div class="row2" style="margin-top:8px"><button class="btn ghost" data-a="cropFill">Fill banner</button><button class="btn ghost" data-a="cropFit">Fit whole photo</button></div>'+
      '<button class="btn block" data-a="cropDone">Use this banner</button><button class="btn ghost block" data-a="cropCancel">Cancel</button>');
    setTimeout(initEditor,40)};
  im.onerror=function(){toast('That image could not be opened. Try a different photo.')};
  im.src=raw}
function edApply(skipSlider){
  var e=ed,img=$('#cimg');if(!e||!img)return;
  e.s=Math.min(Math.max(e.s,e.sf),e.smax);
  var w=e.iw*e.s,h=e.ih*e.s,mx=Math.max(0,(w-e.fw)/2),my=Math.max(0,(h-e.fh)/2);
  e.cx=w>=e.fw?Math.min(mx,Math.max(-mx,e.cx)):0;e.cy=h>=e.fh?Math.min(my,Math.max(-my,e.cy)):0;
  img.style.width=w+'px';img.style.height=h+'px';img.style.left=(e.fw/2+e.cx-w/2)+'px';img.style.top=(e.fh/2+e.cy-h/2)+'px';
  var z=$('#zoom');if(z&&!skipSlider&&e.smax>e.sf)z.value=Math.round(100*Math.log(e.s/e.sf)/Math.log(e.smax/e.sf))}
function initEditor(){
  var f=$('#crop'),img=$('#cimg'),e=ed;if(!f||!img||!e)return;
  img.src=e.raw;e.fw=f.clientWidth||300;e.fh=f.clientHeight||100;
  e.sc=Math.max(e.fw/e.iw,e.fh/e.ih);e.sf=Math.min(e.fw/e.iw,e.fh/e.ih);e.smax=e.sc*4;
  var d=draft.bannerEdit;
  if(d){e.s=e.sc*d.z;e.cx=d.cx*e.fw;e.cy=d.cy*e.fh}else{e.s=e.sc;e.cx=0;e.cy=0}
  edApply();
  var ptr={},d0=0,s0=0;
  f.addEventListener('pointerdown',function(ev){try{f.setPointerCapture(ev.pointerId)}catch(x){}ptr[ev.pointerId]={x:ev.clientX,y:ev.clientY};var k=Object.keys(ptr);if(k.length===2){d0=dist(ptr[k[0]],ptr[k[1]]);s0=e.s}});
  f.addEventListener('pointermove',function(ev){var p=ptr[ev.pointerId];if(!p)return;var k=Object.keys(ptr);
    if(k.length===1){e.cx+=ev.clientX-p.x;e.cy+=ev.clientY-p.y;p.x=ev.clientX;p.y=ev.clientY}
    else{p.x=ev.clientX;p.y=ev.clientY;var dd=dist(ptr[k[0]],ptr[k[1]]);if(d0>0)e.s=s0*dd/d0}
    edApply()});
  function up(ev){delete ptr[ev.pointerId]}
  f.addEventListener('pointerup',up);f.addEventListener('pointercancel',up);
  f.addEventListener('wheel',function(ev){ev.preventDefault();e.s*=ev.deltaY<0?1.08:.92;edApply()},{passive:false})}
function finishCrop(){
  var e=ed;if(!e)return;
  var k=1200/e.fw,c=document.createElement('canvas');c.width=1200;c.height=Math.round(e.fh*k);
  var x=c.getContext('2d');x.fillStyle='#05070D';x.fillRect(0,0,c.width,c.height);
  var w=e.iw*e.s*k,h=e.ih*e.s*k;x.drawImage(e.img,(e.fw/2+e.cx)*k-w/2,(e.fh/2+e.cy)*k-h/2,w,h);
  draft.bannerImg=c.toDataURL('image/jpeg',.82);draft.banner='custom';draft.bannerRaw=e.raw;draft.bannerEdit={z:e.s/e.sc,cx:e.cx/e.fw,cy:e.cy/e.fh};
  ed=null;profileSheet(true)}

  moveSlot:function(el){var i=Number(el.dataset.i),j=i+Number(el.dataset.d),sl=slots();if(j<0||j>2)return;var t=sl[i];sl[i]=sl[j];sl[j]=t;setSlots(sl);slotSheet(j)},
  setBg:function(el){if(levelFor(S.xp)<20)return;S.settings.bg=el.dataset.v;save();render()},
  setPat:function(el){if(levelFor(S.xp)<20)return;S.settings.pat=el.dataset.v;save();render()},
  sound:function(){S.settings.sound=!S.settings.sound;save();render();if(S.settings.sound)playSnd('study')},
  popups:function(){S.settings.popups=!(S.settings.popups!==false);save();render()},
  preview:function(el){var k=el.dataset.v;notify(Object.assign({type:k,preview:true},PSAMPLE[k]))},
  ntfClose:function(){closeNotif()},
  ntfOpen:function(){var a=nCur&&nCur.action;closeNotif();ntfRun(a)},
  targetSheet:function(){openSheet('<h2>Daily target</h2><p class="muted">How much XP counts as a fully productive day (100%). A day at 70% or more is a productive day.</p><label for="g-t">XP per day (50 to 500)</label><input id="g-t" type="number" min="50" max="500" step="10" inputmode="numeric" value="'+target()+'"><div class="err" id="err" role="alert"></div><button class="btn block" data-a="saveTarget">Save target</button>')},
  saveTarget:function(){var n=parseInt(v('g-t'),10);if(isNaN(n)||n<50||n>500){err('Enter a number from 50 to 500.');return}S.settings.target=n;save();closeSheet();render();toast('Daily target set to '+n+' XP')},
  timerStart:function(){var c=v('t-course');if(!c){err('Enter the course or subject you are studying.');return}
    if(S.timer)return;var now=Date.now();S.timer={course:c,topic:v('t-topic'),start:now,mark:now,ms:0,prompt:null,missed:0,passed:0};save();render()},
  timerCheck:function(){var T=S.timer;if(!T)return;var now=Date.now();
    if(T.prompt&&now-T.prompt<=WINDOW){T.ms=Math.min(CAPMS,T.ms+Math.min(Math.max(0,now-T.mark),CAPMS));T.passed++;toast('Check passed')}
    else{T.missed++;toast('Check missed. That stretch was not counted.')}
    T.mark=now;T.prompt=null;save();var o=$('#chkpop');if(o)o.remove();tick()},
  timerEnd:endSheet,
  timerSave:function(){saveSession()},
  timerCancel:function(){openSheet('<h2>Discard session?</h2><p class="muted">No XP will be earned for this session.</p><button class="btn danger block" data-a="timerDiscard">Discard session</button><button class="btn ghost block" data-a="closeSheet">Keep studying</button>')},
  timerDiscard:function(){S.timer=null;save();closeSheet();render();toast('Session discarded')},
  checkUpdate:function(){checkUpdate(true)},
  updLater:function(){var o=$('#updpop');if(o)o.remove()},
  updNow:function(){applyUpdate(pendingV)},
  resetAsk:function(){openSheet('<h2>Erase everything?</h2><p class="muted">This deletes your profile, missions, XP and badges from this device. It cannot be undone.</p><button class="btn danger block" data-a="reset">Erase all data</button><button class="btn ghost block" data-a="closeSheet">Keep my data</button>')},
  reset:function(){S=fresh();save();closeSheet();tab='home';tool=null;draft={avatar:'🦊',banner:'sakura',bannerImg:null,bannerRaw:null,bannerEdit:null};render()}
};
document.addEventListener('click',function(e){var el=e.target.closest('[data-a]');if(!el)return;var f=A[el.dataset.a];if(f)f(el)});
document.addEventListener('change',function(e){
  if(e.target.id==='bnfile'&&e.target.files[0]){var file=e.target.files[0];e.target.value='';
    readImage(file,1600,function(d){if(!d){toast('That image could not be read. Try a different photo.');return}draft.bannerEdit=null;openBannerEditor(d)})}
  if(e.target.id==='vol')playSnd('study');
  if(e.target.id==='evfile'&&e.target.files[0]){var f2=e.target.files[0];e.target.value='';
    readImage(f2,700,function(d){var n=$('#evnote');if(!d){if(n)n.textContent='That image could not be read. Try a different photo.';return}if(fin)fin.img=d;if(n)n.textContent='Photo added ✓'})}});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='zoom'&&ed){ed.s=ed.sf*Math.pow(ed.smax/ed.sf,Number(t.value)/100);edApply(true)}
  if(t.id==='tq'){tq=t.value;var g=$('#tgrid');if(g)g.innerHTML=toolCards()}
  if(t.id==='vol'){S.settings.volume=Number(t.value);save();var vv=$('#volv');if(vv)vv.textContent=t.value+'%'}});
document.addEventListener('pointerdown',function(e){if(e.target&&e.target.closest&&e.target.closest('.ntf'))holdNotif()});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){if(nCur){closeNotif();return}var o=document.querySelector('.overlay');if(o)o.remove();else{var u=$('#updpop');if(u)u.remove();else closeSheet()}}
  if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.type!=='file'&&e.target.type!=='range'&&e.target.type!=='search'){var b=$('#sheet [data-a^=save]')||$('#app [data-a=start]')||$('#app [data-a=timerStart]');if(b){e.preventDefault();b.click()}}});
document.addEventListener('visibilitychange',function(){if(!document.hidden){checkUpdate(false);tick();setTimeout(checkReminders,600)}});

showBoot('Loading');
render();

if(pend){lsSet('xenni_upd','');setTimeout(function(){if(newer(pend,APP_VERSION))toast('The update did not finish.\nClose Xenni completely, then open it again.');else toast('Updated to Xenni '+APP_VERSION)},2400)}
setTimeout(hideBoot,1800);

setInterval(rotateMsg,30*60000);

})();
