<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6C5CE7">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Xenni: Study Smarter. Stay Organized. Level Up.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8F7FF;--card:#fff;--ink:#241F4A;--muted:#6F6A99;--line:#E7E4FA;--soft:#EFEDFF;--purple:#6C5CE7;--mint:#00D2B4;--gold:#FFC93C;--coral:#FF6B6B}
[data-theme=dark]{--bg:#1E1B3A;--card:#2A2650;--ink:#F3F1FF;--muted:#B0ABDC;--line:#3E3870;--soft:#352F66}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Nunito',ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;min-height:100vh}
h1,h2,h3,.disp{font-family:'Baloo 2','Nunito',ui-rounded,system-ui,sans-serif;line-height:1.1}
h1{font-size:1.9rem;font-weight:800;margin:8px 0 14px}
h3{font-size:1.1rem;font-weight:700;margin:22px 0 10px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
.shell{max-width:520px;margin:0 auto;padding:18px 16px 160px}
.muted{color:var(--muted)}

/* loading screen */
.boot{position:fixed;inset:0;z-index:100;display:grid;place-items:center;text-align:center;padding:30px;color:#fff;background:radial-gradient(circle at 50% 28%,#6C5CE7,#1E1B3A 72%);transition:opacity .5s,visibility .5s}
.boot.out{opacity:0;visibility:hidden}
.boot-in{max-width:340px}
.boot svg{width:88px;height:88px;filter:drop-shadow(0 14px 24px rgba(0,0,0,.35))}
.boot-name{font-size:2.4rem;font-weight:800;margin:14px 0 8px}
.boot p{font-weight:700;font-size:1.12rem;min-height:3.6em}
.boot .lbar{height:6px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden;margin:18px auto 8px;width:180px}
.boot .lbar i{display:block;height:100%;width:40%;border-radius:99px;background:var(--mint);animation:load 1.2s ease-in-out infinite}
@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
.boot small{font-weight:700;opacity:.85}

/* home header */
.affhero{position:relative;overflow:hidden;border-radius:28px;padding:20px 20px 24px;color:#fff;background:linear-gradient(135deg,#5A48D8,#6C5CE7 55%,#8573F0);box-shadow:0 18px 40px -18px rgba(108,92,231,.6)}
.affhero .g{font-weight:800;font-size:1rem}
.affhero .aff{font-family:'Baloo 2',ui-rounded,sans-serif;font-size:1.6rem;font-weight:700;line-height:1.2;margin-top:8px;padding-right:20px}
.affhero .bar{width:54px;height:6px;border-radius:99px;background:var(--mint);margin-top:14px}
.affhero::after{content:"✦";position:absolute;right:18px;top:10px;font-size:1.9rem;color:var(--gold)}

/* profile card + xp */
.aura{width:92px;height:92px;border-radius:50%;padding:4px;margin-top:-46px;flex:none;animation:glow 3.2s ease-in-out infinite}
.avatar{width:100%;height:100%;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:46px;line-height:1}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(108,92,231,.0),0 0 14px 2px rgba(0,210,180,.35)}50%{box-shadow:0 0 0 6px rgba(108,92,231,.12),0 0 28px 6px rgba(255,201,60,.45)}}
.top{display:flex;gap:14px;align-items:flex-end}
.who{padding-bottom:2px;min-width:0}
.who h2{font-size:1.45rem;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .sub{font-size:.85rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.titlechip{display:inline-flex;gap:8px;align-items:center;margin-top:14px;background:var(--purple);color:#fff;border-radius:999px;padding:5px 14px 5px 6px;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:1.02rem}
.titlechip b{background:var(--gold);color:#241F4A;border-radius:999px;padding:1px 10px;font-size:.85rem}
.xpbar{height:16px;border-radius:99px;background:var(--soft);margin-top:14px;overflow:hidden}
.xpbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--mint),var(--purple));box-shadow:0 0 14px rgba(0,210,180,.6);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.xpmeta{display:flex;justify-content:space-between;font-size:.82rem;font-weight:700;color:var(--muted);margin-top:6px}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pill{background:var(--soft);border-radius:999px;padding:6px 12px;font-weight:800;font-size:.9rem}

/* cards and quests */
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px}
.card+.card{margin-top:12px}
.empty{text-align:center;padding:26px 18px}
.empty p{margin:6px 0 14px;color:var(--muted)}
.quest{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px;margin-bottom:10px}
.quest.is-done{opacity:.62}
.quest.is-done .q-title{text-decoration:line-through}
.check{width:46px;height:46px;border-radius:16px;border:2.5px solid var(--mint);display:grid;place-items:center;font-weight:800;font-size:1.2rem;color:#241F4A;flex:none;transition:transform .15s,background .15s}
.check:not(:disabled):active{transform:scale(.88);background:var(--mint)}
.check:disabled{background:var(--mint);cursor:default}
.q-main{flex:1;min-width:0}
.q-title{font-weight:800;overflow-wrap:anywhere}
.q-meta{display:flex;gap:6px 10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:3px;align-items:center}
.late{color:var(--coral);font-weight:800}
.tag{border-radius:8px;padding:1px 8px;font-weight:700;color:var(--ink);background:rgba(108,92,231,.16)}
.t-test,.t-exam{background:rgba(255,107,107,.2)}
.t-study{background:rgba(0,210,180,.2)}
.t-goal,.t-personal{background:rgba(255,201,60,.28)}
.q-side{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.q-act{display:flex;gap:2px}
.xpchip{background:var(--gold);color:#241F4A;font-weight:800;font-size:.78rem;border-radius:999px;padding:2px 9px;white-space:nowrap}
.x{width:34px;height:34px;border-radius:10px;color:var(--muted);font-size:.95rem}
.x:hover{background:var(--soft)}
.prog{display:flex;justify-content:space-between;align-items:baseline;margin:22px 4px 10px}
.prog h3{margin:0}
.prog span{font-size:.85rem;font-weight:700;color:var(--muted)}
.rem{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);font-weight:600}
.rem:first-of-type{border-top:0;padding-top:0}
.rem:last-child{padding-bottom:0}
.rem .dot{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--soft)}
.rem.coral .dot{background:rgba(255,107,107,.25)}
.rem.gold .dot{background:rgba(255,201,60,.3)}
.lec{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.lec:first-of-type{border-top:0}
.lec small{color:var(--muted);display:block}
.now{background:var(--mint);color:#241F4A;border-radius:8px;font-size:.72rem;font-weight:800;padding:1px 7px;margin-left:6px}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:16px;background:var(--purple);color:#fff;font-weight:800}
.btn.mint{background:var(--mint);color:#241F4A}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.danger{background:var(--coral);color:#241F4A}
.btn.block{display:flex;width:100%;margin-top:18px}
.btn:disabled{opacity:.45}
.btn:active:not(:disabled){transform:scale(.98)}
.seg{display:flex;background:var(--soft);border-radius:16px;padding:4px;margin-bottom:12px}
.seg button{flex:1;min-height:42px;border-radius:12px;font-weight:800;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.ch{flex:none;min-height:38px;padding:0 14px;border-radius:999px;background:var(--soft);font-weight:700;font-size:.9rem}
.ch.on{background:var(--purple);color:#fff}
label{display:block;font-weight:800;font-size:.9rem;margin:14px 0 6px}
input,select,textarea{width:100%;min-height:48px;padding:10px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
input[type=range]{padding:0;min-height:40px;accent-color:var(--purple);border:0;background:none}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:3px solid rgba(108,92,231,.35);border-color:var(--purple)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--coral);font-weight:700;margin-top:8px;min-height:1.2em}
.hint{font-size:.8rem;color:var(--muted);margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.av{aspect-ratio:1;border-radius:18px;background:var(--soft);font-size:1.9rem;border:2.5px solid transparent}
.av.sel,.bn.sel,.typ.sel{border-color:var(--purple);background:rgba(108,92,231,.14)}
.banners{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bn{border-radius:14px;border:2.5px solid transparent;padding:4px;background:var(--soft);text-align:center}
.bn span{display:block;height:46px;border-radius:10px;background-size:cover;background-position:center}
.bn em{display:block;font-style:normal;font-size:.72rem;font-weight:700;margin-top:4px}
.bn:disabled{opacity:.5}
.types{display:flex;flex-wrap:wrap;gap:8px}
.typ{border-radius:14px;padding:8px 12px;background:var(--soft);font-weight:700;font-size:.9rem;border:2.5px solid transparent}
.back{display:inline-flex;align-items:center;gap:4px;min-height:40px;font-weight:800;color:var(--muted);margin:-6px 0 0 -6px;padding:0 10px 0 4px}
.back svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

/* nav + fab */
.dock{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none;z-index:20}
.dock>div{position:relative;width:100%;max-width:520px;pointer-events:auto}
.nav{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:14px;font-size:.72rem;font-weight:800;color:var(--muted)}
.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--purple);background:var(--soft)}
[data-theme=dark] .nav button.on{color:var(--mint)}
.fab{position:absolute;right:18px;top:-74px;width:60px;height:60px;border-radius:20px;background:var(--mint);color:#241F4A;font-size:2rem;font-weight:700;box-shadow:0 12px 24px -8px rgba(0,210,180,.7);display:grid;place-items:center}
.fab:active{transform:scale(.92)}
body[data-fab="0"] .fab{display:none}
body.no-nav .dock{display:none}

/* tools hub */
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;fill:none;stroke:var(--muted);stroke-width:2.2;stroke-linecap:round}
.search input{padding-left:44px;border-radius:999px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tcard{position:relative;aspect-ratio:9/13;border-radius:22px;overflow:hidden;color:#fff;text-align:left;padding:14px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 14px 28px -16px rgba(30,27,58,.7);transition:transform .15s}
.tcard:active{transform:scale(.97)}
.tcard::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 38%,rgba(20,16,50,.62));pointer-events:none}
.tcard>*{position:relative;z-index:1}
.tcard .ring{width:48px;height:48px;border-radius:50%;padding:3px;background:linear-gradient(135deg,#FFC93C,#FF6B6B,#6C5CE7)}
.tcard .ring span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:rgba(20,16,50,.6);font-size:1.4rem}
.tcard .tart{position:absolute;z-index:0;right:-10px;top:30%;font-size:5.6rem;transform:rotate(-14deg);opacity:.28}
.tcard h3{margin:0;font-size:1.35rem;color:#fff}
.tcard small{display:block;font-weight:700;font-size:.8rem;opacity:.95;margin-top:2px}
.tcard .soon{position:absolute;top:14px;right:14px;background:var(--gold);color:#241F4A;border-radius:999px;font-size:.72rem;font-weight:800;padding:2px 10px}
.tcard.more{background:var(--soft);border:2px dashed var(--line);color:var(--ink);box-shadow:none}
.tcard.more::after{display:none}
.tcard.more h3{color:var(--ink)}
.tcard.more .ring span{background:var(--card)}

/* sheet, overlay, popup, toast */
.sheet-wrap{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet-wrap.hidden{display:none}
.scrim{position:absolute;inset:0;background:rgba(20,16,50,.55)}
.sheet{position:relative;width:100%;max-width:520px;max-height:90vh;overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h2{font-size:1.5rem;font-weight:800;margin-bottom:4px}
.overlay{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;color:#fff;background:radial-gradient(circle at 50% 28%,#6C5CE7,#1E1B3A 75%);overflow:hidden}
.overlay .aura{width:150px;height:150px;padding:6px;margin:0 0 18px}
.overlay .avatar{background:#241F4A;font-size:78px}
.overlay .avatar.num{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:3.6rem;color:var(--gold)}
.overlay h2{font-size:2.3rem;font-weight:800}
.overlay p{max-width:30ch;margin:8px 0 22px;font-weight:700;font-size:1.1rem;opacity:.95}
.overlay .btn{min-width:200px}
.cf{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(540deg)}}
.pop{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:24px;background:rgba(20,16,50,.62)}
.pop-card{width:100%;max-width:360px;background:var(--card);border-radius:26px;padding:22px;box-shadow:0 30px 60px -20px rgba(0,0,0,.6);animation:up .28s cubic-bezier(.2,.8,.2,1)}
.pop-card h2{font-size:1.5rem;font-weight:800}
.pop-card ul{margin:10px 0 0 18px;font-weight:600}
.pop-card .row2{margin-top:18px}
.toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-140%);background:#241F4A;color:var(--gold);padding:10px 18px;border-radius:16px;font-weight:800;z-index:120;white-space:pre-line;text-align:center;transition:transform .3s cubic-bezier(.2,.8,.2,1);max-width:90vw;box-shadow:0 12px 30px -10px rgba(0,0,0,.5)}
.toast.show{transform:translate(-50%,0)}

/* banner editor */
.crop{position:relative;width:100%;aspect-ratio:3/1;border-radius:18px;overflow:hidden;background:#1E1B3A;touch-action:none;cursor:grab;border:2px solid var(--purple);margin-top:12px}
.crop:active{cursor:grabbing}
.crop img{position:absolute;max-width:none;pointer-events:none;user-select:none;-webkit-user-drag:none}

/* ranks, profile */
.rank{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:18px;border:1px solid var(--line);background:var(--card);margin-bottom:8px}
.rank.cur{border:2px solid var(--purple);background:rgba(108,92,231,.12)}
.rank.lock{opacity:.55}
.rk-n{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.3rem;min-width:36px;text-align:center;color:var(--purple)}
[data-theme=dark] .rk-n{color:var(--mint)}
.rk-main{flex:1}
.rk-main b{display:block;font-family:'Baloo 2',sans-serif;font-size:1.1rem}
.rk-main span{font-size:.82rem;color:var(--muted)}
.rk-state{font-weight:800}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bd{text-align:center;padding:12px 6px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.bd .ic{font-size:2rem}
.bd b{display:block;font-size:.82rem;margin-top:2px}
.bd small{display:block;font-size:.7rem;color:var(--muted);margin-top:2px}
.bd.lock{opacity:.5}
.bd.lock .ic{filter:grayscale(1)}
.bd.pick{border:2px solid transparent;width:100%}
.bd.pick.sel{border-color:var(--purple);background:rgba(108,92,231,.14)}
.pbanner{height:132px;border-radius:26px 26px 0 0;background-size:cover}
.pcard{border-radius:26px;overflow:hidden;background:var(--card);border:1px solid var(--line);box-shadow:0 18px 40px -22px rgba(108,92,231,.55)}
.pbody{padding:0 18px 18px}
.bio{margin-top:12px;font-weight:600;overflow-wrap:anywhere}
.quote{margin-top:10px;font-style:italic;color:var(--muted)}
.goal{margin-top:10px;background:var(--soft);border-radius:14px;padding:10px 12px;font-weight:700;font-size:.92rem}
.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.slot{aspect-ratio:1;border-radius:18px;background:var(--soft);display:grid;place-items:center;text-align:center;padding:6px;font-size:.72rem;font-weight:700;color:var(--muted);border:2px dashed var(--line)}
.slot.f{border:2px solid var(--gold);color:var(--ink);background:rgba(255,201,60,.18)}
.slot .ic{font-size:1.9rem;display:block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{text-align:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 6px}
.stat b{display:block;font-family:'Baloo 2',sans-serif;font-size:1.7rem;font-weight:800}
.stat span{font-size:.72rem;color:var(--muted);font-weight:700}
.stat em{display:block;font-style:normal;font-weight:800;font-size:.9rem}
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0}
.sw{width:54px;height:32px;border-radius:99px;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.sw[aria-checked=true]{background:var(--mint)}
.sw[aria-checked=true]::after{transform:translateX(22px)}
.notice{background:rgba(255,201,60,.22);border-radius:14px;padding:10px 12px;font-size:.85rem;font-weight:700;margin-top:12px}
.day h3{margin:16px 0 6px}
.day.today h3{color:var(--purple)}
[data-theme=dark] .day.today h3{color:var(--mint)}
.welcome{padding-top:28px}
.welcome h1{font-size:2.4rem;font-weight:800}
.welcome .tag-line{font-weight:700;color:var(--muted);margin-bottom:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.cf{display:none}}
</style>
</head>
<body data-fab="1">
<div class="boot" id="boot" role="status" aria-live="polite"><div class="boot-in">
  <svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#6C5CE7"/><path d="M28 28L72 72" stroke="#fff" stroke-width="13" stroke-linecap="round"/><path d="M72 28L28 72" stroke="#00D2B4" stroke-width="13" stroke-linecap="round"/><path d="M80 10l3.2 9.6L93 23l-9.8 3.4L80 36l-3.2-9.6L67 23l9.8-3.4z" fill="#FFC93C"/></svg>
  <div class="boot-name disp">Xenni</div>
  <p id="bootAff"></p>
  <div class="lbar"><i></i></div>
  <small id="bootNote">Loading</small>
</div></div>
<div class="shell" id="app"></div>
<div class="dock"><div>
  <button class="fab" data-a="addTask" aria-label="Add a mission">+</button>
  <nav class="nav" aria-label="Main">
    <button data-tab="home" data-a="tab" data-v="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>

 {id:'sakura',name:'Sakura dawn',unlock:1,css:'radial-gradient(circle at 20% 30%,rgba(255,255,255,.55) 0 6px,transparent 7px),radial-gradient(circle at 70% 62%,rgba(255,255,255,.4) 0 9px,transparent 10px),radial-gradient(circle at 88% 22%,rgba(255,255,255,.5) 0 5px,transparent 6px),linear-gradient(135deg,#FF9AC1 0%,#C77DFF 60%,#6C5CE7 100%)'},
 {id:'night',name:'Night study',unlock:1,css:'radial-gradient(circle at 15% 25%,#fff 0 1.5px,transparent 2px),radial-gradient(circle at 45% 62%,#fff 0 1px,transparent 1.5px),radial-gradient(circle at 78% 30%,#FFC93C 0 2px,transparent 2.5px),radial-gradient(circle at 90% 72%,#fff 0 1.5px,transparent 2px),linear-gradient(160deg,#1E1B3A,#3D2C8D)'},
 {id:'campus',name:'Mint campus',unlock:3,css:'linear-gradient(120deg,#00D2B4,#3B82F6 70%,#6C5CE7)'},
 {id:'golden',name:'Golden hour',unlock:5,css:'radial-gradient(circle at 80% 120%,#FFF3B0 0 25%,transparent 26%),linear-gradient(160deg,#FFC93C,#FF8A5B 60%,#FF6B6B)'},
 {id:'neon',name:'Neon city',unlock:8,css:'repeating-linear-gradient(90deg,rgba(0,0,0,.55) 0 14px,transparent 14px 22px) bottom/100% 45% no-repeat,linear-gradient(180deg,#2B1B6B,#C026D3 80%,#FF6B6B)'},
 {id:'aurora',name:'Legend aurora',unlock:10,css:'radial-gradient(circle at 30% 20%,rgba(255,255,255,.45),transparent 40%),linear-gradient(120deg,#00D2B4,#6C5CE7,#FF6B6B,#FFC93C)'}];
var AVATARS=['🦊','🐺','🦉','🐉','🦁','🦄','🐘','🦅','🧙🏿','🧙🏽','🧝🏾','🥷🏾'];
var AFFIRM=[
 "You don't have to be perfect today. You just have to start.",
 "Small study sessions add up to big results.",
 "Your effort today is building who you'll be next semester.",
 "You've handled hard days before. This one is no different.",
 "Focus on the next step, not the whole mountain.",
 "Rest is part of the plan. Take it without guilt.",
 "Asking for help is what smart people do.",
 "Progress counts even when it's slow.",
 "Today's work is a gift to your future self.",
 "Every page you read makes the next one easier.",
 "Consistency beats intensity. Show up again today.",
 "You belong here, and you can do more than you think.",
 "One focused hour can change your whole day.",
 "Mistakes are how your brain learns. Keep going.",
 "Your goals are worth the discipline.",
 "Start before you feel ready.",
 "You're building habits that will outlast any exam.",
 "Celebrate small wins. They are the real fuel.",
 "A calm mind learns faster. Breathe, then begin.",
 "Be proud of how far you've come.",

 "You are more than a grade.",
 "Stay curious. Questions are the start of understanding.",

 "Your pace is your own. Keep moving.",

 "Show up for yourself today.",
 "Great students aren't born. They are built one day at a time."];
var TIPS=['Take a short break. Stretch your shoulders.','Drink some water.','Rest your eyes: look far away for 20 seconds.','Stand up and walk for two minutes.'];
var DAYS=[['Monday',1],['Tuesday',2],['Wednesday',3],['Thursday',4],['Friday',5],['Saturday',6],['Sunday',0]];
// To add a tool: add one entry here and, if it has a page, one function in TOOLPAGES below.
var TOOLS=[
 {id:'quiz',name:'Quiz',desc:'Quiz, test and exam modes',icon:'⚡',bg:'linear-gradient(160deg,#FF6B6B,#B42BC4)',ready:true},
 {id:'plan',name:'Planner',desc:'Missions and timetable',icon:'🗓️',bg:'linear-gradient(160deg,#00A28F,#3B6FE0)',ready:true},
 {id:'more',name:'More',desc:'New tools are on the way',icon:'✨',more:true}];

/* ---------- helpers ---------- */
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function pad(n){return String(n).padStart(2,'0')}
function dkey(d){d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function pd(k){var a=k.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])}
function diffDays(a,b){return Math.round((pd(a)-pd(b))/86400000)}
function fmtTime(t){if(!t)return '';var a=t.split(':').map(Number),h=a[0],ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+pad(a[1])+' '+ap}
function fmtDate(k){return pd(k).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})}
function cmp(a,b){return (a.date+(a.time||'99:99')).localeCompare(b.date+(b.time||'99:99'))}
function cum(L){return 50*(L-1)*L}
function levelFor(xp){var L=1;while(L<MAXL&&xp>=cum(L+1))L++;return L}
function titleFor(L){return TITLES[Math.min(Math.max(L,1),MAXL)-1]}
function auraFor(L){
  if(L>=18)return 'conic-gradient(#FF6B6B,#FFC93C,#00D2B4,#6C5CE7,#FF6B6B)';
  if(L>=14)return 'linear-gradient(135deg,#FF6B6B,#FFC93C)';
  if(L>=10)return 'linear-gradient(135deg,#FFC93C,#FF9F43)';
  if(L>=5)return 'linear-gradient(135deg,#6C5CE7,#A29BFE)';
  return 'linear-gradient(135deg,#00D2B4,#6C5CE7)'}
function streakNow(){var s=S.stats;if(!s.last)return 0;return diffDays(dkey(),s.last)<=1?s.streak:0}
function greet(){var h=new Date().getHours();return h<12?'Good morning':h<17?'Good afternoon':'Good evening'}
function bannerCss(p){return (p.banner==='custom'&&p.bannerImg)?"background:url('"+p.bannerImg+"') center/cover":'background:'+(BANNERS.filter(function(b){return b.id===p.banner})[0]||BANNERS[0]).css}
function courses(){var m={};S.tasks.concat(S.lectures).forEach(function(x){if(x.course)m[x.course]=1});return Object.keys(m)}
function slots(){var a=((S.profile&&S.profile.showcase)||[]).slice(0,3).map(function(id){return BADGES.some(function(b){return b.id===id})?id:null});while(a.length<3)a.push(null);return a}
function earned(){return BADGES.filter(function(b){return S.badges.indexOf(b.id)>-1})}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}

/* feedback: sound, vibration, toast */
var ac;
function beep(seq){if(!S.settings.sound)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();var t=ac.currentTime;
  seq.forEach(function(n){var o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=n[0];
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+n[1]);
  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+n[1]+.02);t+=n[1]*.8})}catch(e){}}
function buzz(p){try{if(navigator.vibrate)navigator.vibrate(p)}catch(e){}}
var tt;
function toast(msg){var el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){el.classList.remove('show')},2900)}

/* ---------- UI state ---------- */
var tab='home',tool=null,tq='',pseg='tasks',filter='all',showDone=false,addType='assignment',editId=null,editLecId=null;
var draft={avatar:'🦊',banner:'sakura',bannerImg:null,bannerRaw:null,bannerEdit:null},pf={},ed=null;
var launchAff=AFFIRM[Math.floor(Math.random()*AFFIRM.length)];

function applyTheme(){var m=S.settings.theme,dark=m==='dark'||(m==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme',dark?'dark':'light')}

/* ---------- views ---------- */
function taskRow(t){
  var T=TYPES[t.type],d=diffDays(t.date,dkey()),late=!t.done&&d<0,xp=t.done?t.xp:T.xp;
  var label=t.done?'Done':d<0?'Overdue by '+(-d)+' day'+(-d>1?'s':''):d===0?'Today':d===1?'Tomorrow':fmtDate(t.date);
  if(!t.done&&d>=0&&t.time)label+=', '+fmtTime(t.time);
  return '<div class="quest'+(t.done?' is-done':'')+'">'+
   '<button class="check" data-a="complete" data-id="'+t.id+'" aria-label="Mark '+esc(t.title)+' done"'+(t.done?' disabled':'')+'>'+(t.done?'✓':'')+'</button>'+
   '<div class="q-main"><div class="q-title">'+esc(t.title)+'</div><div class="q-meta"><span class="tag t-'+t.type+'">'+T.icon+' '+T.label+'</span>'+
   (t.course?'<span>'+esc(t.course)+'</span>':'')+'<span class="'+(late?'late':'')+'">'+label+'</span></div></div>'+
   '<div class="q-side"><span class="xpchip">+'+xp+' XP</span>'+(t.done?'':'<div class="q-act"><button class="x" data-a="editTask" data-id="'+t.id+'" aria-label="Edit '+esc(t.title)+'">✎</button><button class="x" data-a="del" data-id="'+t.id+'" aria-label="Delete '+esc(t.title)+'">✕</button></div>')+'</div></div>'}

function reminders(){
  var today=dkey(),out=[],now=new Date(),mins=now.getHours()*60+now.getMinutes();
  S.tasks.filter(function(t){return !t.done}).sort(cmp).forEach(function(t){
    var d=diffDays(t.date,today),T=TYPES[t.type];
    if(d===0&&t.time&&t.type==='study'){var a=t.time.split(':').map(Number),m=a[0]*60+a[1]-mins;if(m>=0&&m<=15){out.push({c:'gold',i:'⏰',x:t.title+' starts in '+m+' minute'+(m===1?'':'s')});return}}
    if(d<0)out.push({c:'coral',i:'⚠️',x:t.title+' is overdue by '+(-d)+' day'+(-d>1?'s':'')});
    else if(d===0)out.push({c:'gold',i:'⏰',x:t.title+' is due today'+(t.time?' at '+fmtTime(t.time):'')});
    else if(d===1)out.push({c:'',i:'📅',x:t.title+' is due tomorrow'});
    else if((t.type==='test'&&d<=3)||(t.type==='exam'&&d<=7))out.push({c:'',i:'📚',x:T.label+' in '+d+' days: '+t.title+'. Time to revise.'})});
  return out.slice(0,5)}

function viewHome(){
  var p=S.profile,today=dkey();
  var missions=S.tasks.filter(function(x){return x.date===today||(!x.done&&x.date<today)}).sort(function(a,b){return (a.done-b.done)||cmp(a,b)});
  var todays=S.tasks.filter(function(x){return x.date===today}),doneN=todays.filter(function(x){return x.done}).length;
  var rem=reminders(),dow=new Date().getDay(),nowM=new Date().getHours()*60+new Date().getMinutes();
  var lecs=S.lectures.filter(function(l){return l.day===dow}).sort(function(a,b){return a.start.localeCompare(b.start)});
  var h='<section class="affhero"><div class="g">'+greet()+', '+esc(p.name)+'</div><p class="aff">'+esc(launchAff)+'</p><div class="bar"></div></section>';
  h+='<div class="prog"><h3>Today\'s missions</h3><span>'+(todays.length?doneN+' of '+todays.length+' done':'Nothing planned')+'</span></div>';
  if(missions.length)h+=missions.map(taskRow).join('')+(todays.length&&doneN<todays.length?'<p class="hint" style="margin:-2px 4px 0">Finish every mission due today for +50 XP.</p>':'');
  else h+='<div class="card empty"><div style="font-size:2rem">🗺️</div><p>No missions for today. Add an assignment, a study session or a personal goal.</p><button class="btn" data-a="addTask">Add a mission</button></div>';
  if(lecs.length){h+='<h3>Today\'s lectures</h3><div class="card">'+lecs.map(function(l){var a=l.start.split(':').map(Number),b=l.end.split(':').map(Number),on=nowM>=a[0]*60+a[1]&&nowM<b[0]*60+b[1];
    return '<div class="lec"><div><b>'+esc(l.course)+'</b>'+(on?'<span class="now">Now</span>':'')+'<small>'+(l.room?esc(l.room):'')+'</small></div><div><b>'+fmtTime(l.start)+'</b><small>to '+fmtTime(l.end)+'</small></div></div>'}).join('')+'</div>'}
  h+='<h3>Reminders</h3><div class="card">';
  if(rem.length)h+=rem.map(function(r){return '<div class="rem '+r.c+'"><span class="dot">'+r.i+'</span><span>'+esc(r.x)+'</span></div>'}).join('');
  else h+='<div class="rem"><span class="dot">🎉</span><span>You are all caught up.</span></div>';
  var tip=TIPS[Math.floor(Date.now()/1800000)%TIPS.length];
  h+='<div class="rem"><span class="dot">💧</span><span>'+tip+'</span></div></div>';
  return h}

/* tools hub */
function backBtn(){return '<button class="back" data-a="toolBack"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>Tools</button>'}
function toolCards(){
  var q=tq.trim().toLowerCase(),list=TOOLS.filter(function(t){return !q||t.name.toLowerCase().indexOf(q)>-1||t.desc.toLowerCase().indexOf(q)>-1});
  if(!list.length)return '<div class="card empty" style="grid-column:1/-1"><p style="margin:0">No tools match "'+esc(tq)+'".</p></div>';
  return list.map(function(t){
    if(t.more)return '<button class="tcard more" data-a="tool" data-v="more"><div class="ring"><span>'+t.icon+'</span></div><div><h3>'+t.name+'</h3><small>'+t.desc+'</small></div></button>';
    return '<button class="tcard" style="background:'+t.bg+'" data-a="tool" data-v="'+t.id+'"><div class="ring"><span>'+t.icon+'</span></div>'+(t.ready===false?'<span class="soon">Soon</span>':'')+
      '<span class="tart" aria-hidden="true">'+t.icon+'</span><div><h3>'+t.name+'</h3><small>'+t.desc+'</small></div></button>'}).join('')}
var TOOLPAGES={plan:function(){return viewPlanner()},quiz:function(){return viewQuiz()}};
function viewTools(){
  if(tool&&TOOLPAGES[tool])return backBtn()+TOOLPAGES[tool]();
  return '<h1>Tools</h1><div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="tq" type="search" placeholder="Search tools" aria-label="Search tools" value="'+esc(tq)+'"></div>'+
    '<h3>Browse all</h3><div class="tgrid" id="tgrid">'+toolCards()+'</div>'}

var FILTERS=[['all','All'],['assign','Assignments'],['exam','Tests and exams'],['study','Study'],['life','Personal']];
var FMAP={assign:['assignment','project'],exam:['test','exam'],study:['study'],life:['goal','personal']};
function tasksPane(){
  var today=dkey(),list=S.tasks.filter(function(t){return filter==='all'||FMAP[filter].indexOf(t.type)>-1});
  var act=list.filter(function(t){return !t.done}).sort(cmp);
  var groups=[['Overdue',act.filter(function(t){return t.date<today})],['Today',act.filter(function(t){return t.date===today})],['Upcoming',act.filter(function(t){return t.date>today})]];
  var done=list.filter(function(t){return t.done}).sort(function(a,b){return b.doneAt-a.doneAt}).slice(0,8);
  var h='<div class="chips" role="group" aria-label="Filter missions">'+FILTERS.map(function(f){return '<button class="ch'+(filter===f[0]?' on':'')+'" data-a="filter" data-v="'+f[0]+'">'+f[1]+'</button>'}).join('')+'</div>';
  if(!act.length&&!done.length)h+='<div class="card empty"><div style="font-size:2rem">📝</div><p>No missions here yet. Add your assignments, tests and exams so Xenni can remind you.</p><button class="btn" data-a="addTask">Add a mission</button></div>';
  groups.forEach(function(g){if(g[1].length)h+='<h3>'+g[0]+'</h3>'+g[1].map(taskRow).join('')});
  if(done.length)h+='<button class="btn ghost block" data-a="toggleDone">'+(showDone?'Hide':'Show')+' completed ('+done.length+')</button>'+(showDone?'<div style="margin-top:12px">'+done.map(taskRow).join('')+'</div>':'');
  return h}
function timePane(){
  var dow=new Date().getDay(),h='<button class="btn block" style="margin-top:0" data-a="addLec">Add a lecture</button>';
  if(!S.lectures.length)return h+'<div class="card empty" style="margin-top:12px"><div style="font-size:2rem">🏫</div><p>No lectures yet. Add your timetable so you can see your week at a glance.</p></div>';
  DAYS.forEach(function(d){var ls=S.lectures.filter(function(l){return l.day===d[1]}).sort(function(a,b){return a.start.localeCompare(b.start)});
    if(ls.length)h+='<div class="day'+(d[1]===dow?' today':'')+'"><h3>'+d[0]+(d[1]===dow?' (today)':'')+'</h3>'+ls.map(function(l){

/* ---------- game logic ---------- */
function complete(id){
  var t=S.tasks.filter(function(x){return x.id===id})[0];if(!t||t.done)return;
  var today=dkey(),xp=TYPES[t.type].xp,lines=[],beforeL=levelFor(S.xp);
  var scored=(t.type==='assignment'||t.type==='project'),late=today>t.date;
  if(scored&&late){xp=Math.round(xp*.4);lines.push('Late finish: reduced XP')}
  var cap=CAPS[t.type];
  if(cap&&S.tasks.filter(function(x){return x.done&&x.type===t.type&&x.doneDay===today}).length>=cap){xp=0;lines.push('Daily XP limit reached for '+TYPES[t.type].label.toLowerCase()+'s. Your streak still counts.')}
  t.done=true;t.doneAt=Date.now();t.doneDay=today;t.xp=xp;
  var s=S.stats;
  if(s.last!==today){s.streak=(s.last&&diffDays(today,s.last)===1)?s.streak+1:1;s.last=today;s.best=Math.max(s.best,s.streak)}
  s.done++;if(t.type==='study')s.study++;if(t.type==='exam')s.exams++;if(scored&&!late)s.onTime++;
  var total=xp;if(xp>0)lines.unshift('+'+xp+' XP');
  var td=S.tasks.filter(function(x){return x.date===today});
  if(td.length&&td.every(function(x){return x.done})&&s.bonusDay!==today){s.bonusDay=today;total+=50;lines.push("Today's plan complete: +50 XP")}
  S.xp+=total;S.coins+=Math.round(total/10);
  var nb=[];BADGES.forEach(function(b){if(S.badges.indexOf(b.id)<0&&b.test(S)){S.badges.push(b.id);nb.push(b)}});
  nb.forEach(function(b){lines.push(b.icon+' Badge unlocked: '+b.name)});
  save();render();beep([[660,.1],[880,.14]]);buzz(30);toast(lines.join('\n'));
  var afterL=levelFor(S.xp);if(afterL>beforeL)setTimeout(function(){showLevelUp(afterL)},700)}

function edApply(skipSlider){

  var w=e.iw*e.s,h=e.ih*e.s,mx=Math.max(0,(w-e.fw)/2),my=Math.max(0,(h-e.fh)/2);
  e.cx=w>=e.fw?Math.min(mx,Math.max(-mx,e.cx)):0;e.cy=h>=e.fh?Math.min(my,Math.max(-my,e.cy)):0;
  img.style.width=w+'px';img.style.height=h+'px';img.style.left=(e.fw/2+e.cx-w/2)+'px';img.style.top=(e.fh/2+e.cy-h/2)+'px';

  var f=$('#crop'),img=$('#cimg'),e=ed;if(!f||!img||!e)return;

  f.addEventListener('pointerdown',function(ev){try{f.setPointerCapture(ev.pointerId)}catch(x){}ptr[ev.pointerId]={x:ev.clientX,y:ev.clientY};var k=Object.keys(ptr);if(k.length===2){d0=dist(ptr[k[0]],ptr[k[1]]);s0=e.s}});
  f.addEventListener('pointermove',function(ev){var p=ptr[ev.pointerId];if(!p)return;var k=Object.keys(ptr);
    if(k.length===1){e.cx+=ev.clientX-p.x;e.cy+=ev.clientY-p.y;p.x=ev.clientX;p.y=ev.clientY}
    else{p.x=ev.clientX;p.y=ev.clientY;var dd=dist(ptr[k[0]],ptr[k[1]]);if(d0>0)e.s=s0*dd/d0}
    edApply()});

function finishCrop(){
  var e=ed;if(!e)return;

  var x=c.getContext('2d');x.fillStyle='#1E1B3A';x.fillRect(0,0,c.width,c.height);
  var w=e.iw*e.s*k,h=e.ih*e.s*k;x.drawImage(e.img,(e.fw/2+e.cx)*k-w/2,(e.fh/2+e.cy)*k-h/2,w,h);
  draft.bannerImg=c.toDataURL('image/jpeg',.82);draft.banner='custom';draft.bannerRaw=e.raw;draft.bannerEdit={z:e.s/e.sc,cx:e.cx/e.fw,cy:e.cy/e.fh};
  ed=null;profileSheet(true)}

function slotSheet(i){
  var sl=slots(),er=earned();
  openSheet('<h2>Shelf slot '+(i+1)+'</h2><p class="muted">Choose a badge for this slot.</p>'+
   (er.length?'<div class="badges" style="margin-top:12px">'+er.map(function(b){return '<button class="bd pick'+(sl[i]===b.id?' sel':'')+'" data-a="setSlot" data-i="'+i+'" data-v="'+b.id+'"><div class="ic">'+b.icon+'</div><b>'+b.name+'</b></button>'}).join('')+'</div>'
     :'<div class="card empty" style="margin-top:12px"><p style="margin:0">Complete missions to earn your first badge.</p></div>')+
   (sl[i]?'<div class="row2" style="margin-top:14px"><button class="btn ghost" data-a="moveSlot" data-i="'+i+'" data-d="-1"'+(i===0?' disabled':'')+'>Move left</button><button class="btn ghost" data-a="moveSlot" data-i="'+i+'" data-d="1"'+(i===2?' disabled':'')+'>Move right</button></div><button class="btn danger block" data-a="clearSlot" data-i="'+i+'">Clear slot</button>':'')+
   '<button class="btn ghost block" data-a="closeSheet">Done</button>')}
function setSlots(a){S.profile.showcase=a;save();render()}

function readImage(file,max,cb){var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){
  var r=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.82))};im.onerror=function(){cb(null)};im.src=fr.result};fr.onerror=function(){cb(null)};fr.readAsDataURL(file)}

function v(id){var e=document.getElementById(id);return e?e.value.trim():''}
function err(m){var e=$('#err');if(e)e.textContent=m}

    if(editId){var t=S.tasks.filter(function(x){return x.id===editId})[0];if(t){t.title=title;t.type=addType;t.course=v('a-course');t.date=date;t.time=v('a-time')}}
    else S.tasks.push({id:uid(),title:title,type:addType,course:v('a-course'),date:date,time:v('a-time'),done:false});

  saveLec:function(){
    var c=v('l-course'),a=v('l-start'),b=v('l-end');
    if(!c){err('Add the course name.');return}
    if(!a||!b||b<=a){err('Choose an end time after the start time.');return}
    var data={course:c,day:Number(v('l-day')),start:a,end:b,room:v('l-room')};
    if(editLecId){var l=S.lectures.filter(function(x){return x.id===editLecId})[0];if(l)Object.assign(l,data)}
    else S.lectures.push(Object.assign({id:uid()},data));
    var was=editLecId;editLecId=null;save();closeSheet();render();toast(was?'Lecture updated':'Lecture added')},
  start:function(){

    save();tab='home';render()},

  reset:function(){S=fresh();save();closeSheet();tab='home';tool=null;draft={avatar:'🦊',banner:'sakura',bannerImg:null,bannerRaw:null,bannerEdit:null};render()}
};
